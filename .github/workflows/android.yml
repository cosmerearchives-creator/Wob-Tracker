name: Build and publish Android updates

on:
  push:
    branches: [main, feature/sticky-relationships-progress, feature/arcanum-sharing]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wob-tracker-main-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || { echo 'Android API 35 missing on runner'; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo 'Android build tools 35 missing on runner'; exit 1; }
      - name: Download official Archives receiver for end-to-end test
        run: curl --fail --location --retry 3 --output "$RUNNER_TEMP/Archives.apk" https://github.com/cosmerearchives-creator/Mind-Map/releases/download/v0.14.2/Silverlight.apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify transactional acknowledgment safeguards
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            INTEGRATION=false
            if [ -f "$RUNNER_TEMP/Archives.apk" ]; then
              adb install -r "$RUNNER_TEMP/Archives.apk"
              INTEGRATION=true
            fi
            adb shell svc wifi disable
            adb shell svc data disable
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.archivesIntegration="$INTEGRATION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tracker-sharing-test-results
          path: app/build/reports/androidTests/
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo 'Signing secrets missing. See SIGNING.md'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/wob-release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/wob-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_CODE: ${{ github.run_number }}
        run: |
          RELEASE_NAME="0.1.$RELEASE_CODE"
          gradle --no-daemon :app:assembleRelease -PreleaseVersionName="$RELEASE_NAME" -PreleaseVersionCode="$RELEASE_CODE"
          test -s app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "WoB-Tracker-v$RELEASE_NAME.apk"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
      - name: Publish versioned GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$RELEASE_NAME"
          gh release create "$TAG" "WoB-Tracker-$TAG.apk" --target "$GITHUB_SHA" --title "WoB Tracker $TAG" --notes "Automated Android build from main." --latest
