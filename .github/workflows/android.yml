name: Android build and signed release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: wob-tracker-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Verify signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo 'Missing Android signing secrets. See SIGNING.md'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/wob-release.jks"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/wob-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon :app:assembleRelease -PreleaseVersionName="${VERSION_NAME#v}" -PreleaseVersionCode="$VERSION_CODE"
          mv app/build/outputs/apk/release/app-release.apk "WoB-Tracker-${VERSION_NAME}.apk"
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "WoB-Tracker-$TAG.apk" --title "WoB Tracker $TAG" --notes "Android APK release." --prerelease
