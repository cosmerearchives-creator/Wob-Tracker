name: Build and publish Android updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wob-tracker-main-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo 'Signing secrets missing. See SIGNING.md'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/wob-release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/wob-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_CODE: ${{ github.run_number }}
        run: |
          RELEASE_NAME="0.1.$RELEASE_CODE"
          gradle --no-daemon :app:assembleRelease -PreleaseVersionName="$RELEASE_NAME" -PreleaseVersionCode="$RELEASE_CODE"
          test -s app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "WoB-Tracker-v$RELEASE_NAME.apk"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$RELEASE_NAME"
          gh release create "$TAG" "WoB-Tracker-$TAG.apk" --target "$GITHUB_SHA" --title "WoB Tracker $TAG" --notes "Automated Android build from main." --prerelease
